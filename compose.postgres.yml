name: offerpilot-s5
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    container_name: offerpilot-s5-postgres
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_messages=fatal", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_PASSWORD: ${S5_POSTGRES_ADMIN_PASSWORD:?Generate a private local .env first}
      S5_MIGRATOR_PASSWORD: ${S5_MIGRATOR_PASSWORD:?Required}
      S5_APP_PASSWORD: ${S5_APP_PASSWORD:?Required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${S5_POSTGRES_PORT:-55432}:5432"
    volumes:
      - s5_postgres:/var/lib/postgresql
      - ./scripts/postgres/init.sh:/docker-entrypoint-initdb.d/10-offerpilot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
    shm_size: 128mb
volumes:
  s5_postgres:
