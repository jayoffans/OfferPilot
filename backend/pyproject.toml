[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "offerpilot-backend"
version = "0.1.0"
description = "OfferPilot MVP API skeleton"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<0.142",
    "SQLAlchemy>=2.1,<2.2",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
